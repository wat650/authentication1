{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-4">Inscription</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary">S’inscrire</button>
    </form>
</div>
{% endblock %}
