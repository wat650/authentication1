<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentification Django{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="bg-{{ message.tags }}-100 p-4 mb-4 rounded">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-danger text-white px-4 py-2 rounded hover:bg-danger">Se déconnecter</button>
            </form>
        {% endif %}

        <form method="post" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary">S'inscrire</button>
        </form>

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <button type="submit" class="bg-success text-white px-4 py-2 rounded hover:bg-success">Se connecter</button>
        </form>

        {% block content %}
        {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    </div>
</body>
</html>
